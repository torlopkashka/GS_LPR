# VPS: только Uptime Kuma — сторож, который замечает пропажу связи с объектом.
# Запуск: docker compose up -d
services:
  kuma:
    image: louislam/uptime-kuma:2
    container_name: kuma
    restart: unless-stopped
    ports:
      # веб-интерфейс Kuma и адрес для сигналов с объекта: http://IP-VPS:3001
      - "3001:3001"
    volumes:
      - ./data:/app/data
