# Сервер работает на этом же ПК в Docker
server_url: ws://127.0.0.1:8000
token: REPLACE_WITH_AGENT_TOKEN   # значение AGENT_TOKEN из файла .env
name: gate-pc

# Способ управления: serial | hid | http | ewelink | gpio | command | dummy
# Для Wi-Fi-реле (Sonoff SV и др.) укажите http и заполните раздел http ниже
driver: serial
max_pulse: 3        # защита: не держать реле дольше N секунд

# USB-реле на CH340 (LCUS-1). Номер COM-порта смотрите в Диспетчере устройств
# → «Порты (COM и LPT)» → USB-SERIAL CH340 (COMx). В Linux: /dev/ttyUSB0
serial:
  port: COM3
  baudrate: 9600
  channel: 1

# USB HID-реле (USBRelay1/2, «dcttech»): определяется как HID-устройство, без COM-порта.
# Нужен пакет hidapi (раскомментируйте в requirements.txt)
hid:
  vendor_id: "0x16c0"
  product_id: "0x05df"
  channel: 1

# Сетевое реле (driver: http). Оставьте ОДИН активный pulse_url. Длительность импульса
# задаётся в самом реле, агент только посылает команду.
http:
  # Sonoff SV с прошивкой Tasmota (в Tasmota: PulseTime1 10 и PowerOnState 0, см. docs/gate-control.md).
  # Если в Tasmota не задан WebPassword, уберите из адреса user=admin&password=ПАРОЛЬ&
  pulse_url: http://192.168.1.60/cm?user=admin&password=ПАРОЛЬ&cmnd=Power%20On
  # Shelly Plus 1 / Shelly 1 Gen3 (само выключится через 1 с):
  # pulse_url: http://192.168.1.50/rpc/Switch.Set?id=0&on=true&toggle_after=1
  # Shelly 1 первого поколения:
  # pulse_url: http://192.168.1.50/relay/0?turn=on&timer=1
  # ESPHome (кнопка "gate_open" в web_server):
  # pulse_url: http://192.168.1.60/button/gate_open/press
  # method: POST

# Реле eWeLink на заводской прошивке (driver: ewelink). Сначала команда идёт по локальной сети
# (интернет не нужен; включается командой `python ewelink_setup.py lan`), при сбое — через облако.
# Подробно: docs/gate-control.md, раздел «Облако eWeLink и локальная сеть».
ewelink:
  appid: ВАШ_APPID                  # ключи приложения с портала разработчика https://dev.ewelink.cc
  appsecret: ВАШ_APP_SECRET         # хранится в тайне
  redirect_url: http://127.0.0.1:8888/redirectUrl   # тот же адрес, что указан в приложении на dev.ewelink.cc
  device_id: ""                     # узнать: python ewelink_setup.py devices
  token_file: ewelink_token.json    # создаётся командой python ewelink_setup.py login
  timeout: 8
  lan_file: ewelink_lan.json        # создаётся командой python ewelink_setup.py lan (ключ реле и его адрес)
  # lan_host: 192.168.1.50          # адрес реле вручную, если нужно задать его принудительно

# Raspberry Pi + модуль реле (только Linux)
gpio:
  pin: 17
  active_high: true

# Любая команда
command:
  on_cmd: usbrelay BITFT_1=1
  off_cmd: usbrelay BITFT_1=0
