# Конфигурация распознавания номеров. Секреты (пароли, токены) — в файле .env.

cameras:
  # Адрес RTSP берётся в UniFi Protect: камера → Settings → Advanced → RTSP.
  # Включите поток Medium (1280x720) или High. Protect выдаёт адрес вида
  #   rtsps://192.168.1.1:7441/AbCdEf123?enableSrtp
  # Для ffmpeg замените его на незашифрованный вариант:
  #   rtsp://192.168.1.1:7447/AbCdEf123
  # 192.168.1.1 здесь — адрес консоли UniFi (UDM / Cloud Key / NVR) в локальной сети.
  # Проверить адрес можно в VLC: «Медиа → Открыть URL».
  - id: outside
    name: Въезд (снаружи)
    url: rtsp://192.168.1.1:7447/REPLACE_OUTSIDE_TOKEN
    role: entry
    open_policy: whitelist      # whitelist | any | none
    # Зона интереса [x1, y1, x2, y2] в долях кадра. Настройте по превью на панели:
    # оставьте только место, где машина стоит перед воротами.
    roi: [0.15, 0.30, 0.95, 1.0]
    process_fps: 4

  - id: inside
    name: Выезд (изнутри)
    url: rtsp://192.168.1.1:7447/REPLACE_INSIDE_TOKEN
    role: exit
    open_policy: whitelist      # для выезда часто ставят any — открывать любой машине
    roi: [0.05, 0.30, 0.85, 1.0]
    process_fps: 4

recognition:
  detector_model: yolo-v9-t-384-license-plate-end2end   # при мелких номерах: yolo-v9-t-512-...
  ocr_model: cct-xs-v2-global-model                     # точнее, но медленнее: cct-s-v2-global-model
  detector_conf: 0.4
  plate_format: ru          # ru | ru_or_any | any
  min_ocr_conf: 0.6
  min_confirmations: 2      # сколько одинаковых чтений нужно для открытия
  max_distance: 0           # 1 — допускать одну ошибку при сравнении со списком
  session_gap: 2.5
  onnx_threads: 1
  save_crops: true

gate:
  pulse_seconds: 1.0        # длительность замыкания реле
  min_interval: 8           # не слать повторную команду чаще, чем раз в N секунд
  plate_cooldown: 60        # одному номеру — не чаще раза в N секунд (с обеих камер)
  ack_timeout: 5

link:
  # Связь с ботом Битрикс24 на VPS. Адрес и секрет задаются в .env (VPS_LINK_URL, LINK_TOKEN)
  site_name: Ворота
  notify_granted: true      # уведомлять о каждом разрешённом проезде
  notify_denied: true       # уведомлять о неизвестных номерах
  interactive: true         # кнопки «Открыть» и «В список» под уведомлениями
  max_callback_age: 900     # кнопка «Открыть» под уведомлением действует 15 минут
  agent_alert_after: 30     # предупредить, если агент ворот не на связи дольше 30 с
  camera_alert_after: 120   # ... или нет видео с камеры дольше 2 минут

healthcheck:
  # Адрес монитора Uptime Kuma на VPS задаётся в .env (HEALTHCHECK_URL). Сервер отправляет запрос раз в interval
  # секунд: «всё в порядке» или «сбой» с описанием проблемы
  interval: 60

retention_days: 30          # сколько хранить журнал и снимки
