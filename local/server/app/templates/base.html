<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ворота{% endblock %} · GS LPR</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">🚗 GS LPR</a>
  <nav>
    <a href="/" class="{% if request.url.path == '/' %}on{% endif %}">Панель</a>
    <a href="/plates" class="{% if request.url.path.startswith('/plates') %}on{% endif %}">Номера</a>
    <a href="/events" class="{% if request.url.path.startswith('/events') %}on{% endif %}">Журнал</a>
    <a href="/logout">Выход</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
</body>
</html>
