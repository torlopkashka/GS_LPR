# /etc/wireguard/wg0.conf на компьютере у ворот (Linux)
[Interface]
Address = 10.8.0.2/24
PrivateKey = <GATE_PC_PRIVATE_KEY>
# Пересылка трафика с VPS в локальную сеть объекта с подменой адреса (NAT),
# чтобы не настраивать маршруты на роутере. eth0 — интерфейс в сторону LAN.
PostUp = sysctl -w net.ipv4.ip_forward=1; iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE; iptables -A FORWARD -i wg0 -o eth0 -j ACCEPT; iptables -A FORWARD -i eth0 -o wg0 -m state --state RELATED,ESTABLISHED -j ACCEPT
PostDown = iptables -t nat -D POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE; iptables -D FORWARD -i wg0 -o eth0 -j ACCEPT; iptables -D FORWARD -i eth0 -o wg0 -m state --state RELATED,ESTABLISHED -j ACCEPT

[Peer]
PublicKey = <VPS_PUBLIC_KEY>
Endpoint = <VPS_PUBLIC_IP>:51820
AllowedIPs = 10.8.0.0/24
# Соединение инициирует объект — белый IP и проброс портов на объекте не нужны
PersistentKeepalive = 25
