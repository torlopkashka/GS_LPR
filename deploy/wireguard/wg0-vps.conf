# /etc/wireguard/wg0.conf на VPS
# Ключи: wg genkey | tee privatekey | wg pubkey > publickey
[Interface]
Address = 10.8.0.1/24
ListenPort = 51820
PrivateKey = <VPS_PRIVATE_KEY>

[Peer]
# Компьютер у ворот
PublicKey = <GATE_PC_PUBLIC_KEY>
# 10.8.0.2 — сам компьютер, 192.168.1.0/24 — локальная сеть объекта (камеры, консоль UniFi)
AllowedIPs = 10.8.0.2/32, 192.168.1.0/24
