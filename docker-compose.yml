# Сервер распознавания. Запуск: docker compose up -d --build
services:
  lpr:
    build: ./server
    container_name: lpr
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./server/config.yaml:/config/config.yaml:ro
      - ./data:/data
    ports:
      # веб-интерфейс http://IP-компьютера:8000 и подключение агента ворот
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
