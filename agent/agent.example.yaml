# Адрес сервера (wss:// — через HTTPS/Caddy, ws:// — напрямую или через WireGuard)
server_url: wss://lpr.example.ru
token: REPLACE_WITH_AGENT_TOKEN   # то же значение, что AGENT_TOKEN в .env сервера
name: gate-pc

# Способ управления: serial | hid | http | gpio | command | dummy
driver: serial
max_pulse: 3        # защита: не держать реле дольше N секунд

# USB-реле на CH340 (LCUS-1). В Linux порт /dev/ttyUSB0, в Windows — COM3 и т.п.
serial:
  port: /dev/ttyUSB0
  baudrate: 9600
  channel: 1

# USB HID-реле (определяется как HID-устройство, без COM-порта)
hid:
  vendor_id: "0x16c0"
  product_id: "0x05df"
  channel: 1

# Сетевое реле. Shelly Plus 1 / Shelly 1 Gen3 (сам выключится через 1 с):
http:
  pulse_url: http://192.168.1.50/rpc/Switch.Set?id=0&on=true&toggle_after=1
  # Shelly 1 первого поколения:
  # pulse_url: http://192.168.1.50/relay/0?turn=on&timer=1
  # ESPHome (кнопка "gate_open" в web_server):
  # pulse_url: http://192.168.1.60/button/gate_open/press
  # method: POST

# Raspberry Pi + модуль реле
gpio:
  pin: 17
  active_high: true

# Любая команда (например, утилита usbrelay)
command:
  on_cmd: usbrelay BITFT_1=1
  off_cmd: usbrelay BITFT_1=0
